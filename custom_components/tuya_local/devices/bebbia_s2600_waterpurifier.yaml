name: Water purifier
products:
  - id: djnzsstedf8xyi7a
    manufacturer: Bebbia
    model: S2-600
entities:
  - entity: switch
    dps:
      - id: 101
        name: switch
        type: boolean
        optional: true

  - entity: sensor
    name: TDS out
    icon: "mdi:water-opacity"
    dps:
      - id: 1
        name: sensor
        type: integer
        unit: ppm
        class: measurement
        optional: true

  - entity: sensor
    name: M2 filter life
    icon: "mdi:filter-outline"
    dps:
      - id: 3
        name: sensor
        type: integer
        unit: "%"
        class: measurement
        optional: true

  - entity: sensor
    name: S2 filter life
    icon: "mdi:filter"
    dps:
      - id: 5
        name: sensor
        type: integer
        unit: "%"
        class: measurement
        optional: true

  - entity: sensor
    name: Status
    icon: "mdi:state-machine"
    dps:
      - id: 16
        name: sensor
        type: string
        optional: true

  - entity: button
    name: S2 filter reset
    category: config
    icon: "mdi:water-sync"
    dps:
      - id: 17
        name: button
        type: boolean
        optional: true

  - entity: button
    name: M2 filter reset
    category: config
    icon: "mdi:water-sync"
    dps:
      - id: 19
        name: button
        type: boolean
        optional: true

  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 23
        type: bitfield
        name: sensor
        optional: true
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 23
        type: bitfield
        name: fault_code
        optional: true

  - entity: sensor
    name: M2 filter remaining
    class: duration
    category: diagnostic
    dps:
      - id: 26
        name: sensor
        type: integer
        unit: d
        class: measurement
        optional: true

  - entity: sensor
    name: S2 filter remaining
    class: duration
    category: diagnostic
    dps:
      - id: 28
        name: sensor
        type: integer
        unit: d
        class: measurement
        optional: true

  - entity: sensor
    name: Total purified water
    class: volume
    category: diagnostic
    icon: "mdi:water-check"
    dps:
      - id: 32
        name: sensor
        type: integer
        unit: L
        class: total_increasing
        optional: true

  - entity: sensor
    name: Total inlet water
    class: volume
    category: diagnostic
    icon: "mdi:water-pump"
    dps:
      - id: 102
        name: sensor
        type: integer
        unit: L
        class: total_increasing
        optional: true
